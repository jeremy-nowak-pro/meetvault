<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetVault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0f0f1a; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.08); }
    .glass-hover:hover { background: rgba(255,255,255,0.09); }
    .screen { display: none; }
    .screen.active { display: flex; flex-direction: column; min-height: 100dvh; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot-done { background: #10b981; }
    .dot-error { background: #ef4444; }
    .dot-pending { background: #14b8a6; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .avatar { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; flex-shrink: 0; }
    input:focus { outline: none; border-color: rgba(20,184,166,0.6) !important; }
    .btn-primary { background: #14b8a6; color: #0f0f1a; font-weight: 600; border-radius: 12px; padding: 12px 20px; transition: background .2s; }
    .btn-primary:hover { background: #0d9488; }
    .btn-ghost { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px 16px; transition: background .2s; }
    .btn-ghost:hover { background: rgba(255,255,255,0.1); }
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
    .modal-box { background: #1a1a2e; border-radius: 20px 20px 0 0; border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 480px; padding: 24px; }
    .field-input { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 12px 14px; width: 100%; color: #e2e8f0; font-size: 15px; }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════
     ÉCRAN 1 : LISTE DES CLIENTS
═══════════════════════════════════════ -->
<div id="screen-clients" class="screen active">
  <div class="px-4 pt-10 pb-4 flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-white">MeetVault</h1>
      <p class="text-sm text-slate-400 mt-0.5">Vos clients</p>
    </div>
    <button onclick="openNewClientModal()" class="btn-primary text-sm px-4 py-2.5">+ Client</button>
  </div>

  <div id="clients-list" class="flex-1 px-4 pb-8 space-y-3"></div>

  <div id="clients-empty" class="hidden flex-1 flex flex-col items-center justify-center px-8 text-center pb-20">
    <div class="text-5xl mb-4">👤</div>
    <p class="text-slate-300 font-medium text-lg mb-1">Aucun client</p>
    <p class="text-slate-500 text-sm mb-6">Commencez par ajouter votre premier client</p>
    <button onclick="openNewClientModal()" class="btn-primary">+ Ajouter un client</button>
  </div>
</div>

<!-- ═══════════════════════════════════════
     ÉCRAN 2 : RÉUNIONS D'UN CLIENT
═══════════════════════════════════════ -->
<div id="screen-meetings" class="screen">
  <div class="px-4 pt-10 pb-4 flex items-center gap-3">
    <button onclick="showClients()" class="w-9 h-9 flex items-center justify-center rounded-xl glass text-slate-300">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="flex-1 min-w-0">
      <h1 id="client-name-title" class="text-xl font-bold text-white truncate"></h1>
      <p id="client-company-subtitle" class="text-sm text-slate-400 truncate"></p>
    </div>
    <button onclick="recordForClient()" class="btn-primary text-sm px-4 py-2.5 flex items-center gap-2">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg>
      Enregistrer
    </button>
  </div>

  <div id="meetings-list" class="flex-1 px-4 pb-8 space-y-3"></div>

  <div id="meetings-empty" class="hidden flex-1 flex flex-col items-center justify-center px-8 text-center pb-20">
    <div class="text-5xl mb-4">🎙</div>
    <p class="text-slate-300 font-medium text-lg mb-1">Aucune réunion</p>
    <p class="text-slate-500 text-sm mb-6">Enregistrez votre premier RDV avec ce client</p>
    <button onclick="recordForClient()" class="btn-primary">Enregistrer un RDV</button>
  </div>
</div>

<!-- ═══════════════════════════════════════
     MODAL : NOUVEAU CLIENT
═══════════════════════════════════════ -->
<div id="modal-client" class="modal-bg hidden" onclick="closeNewClientModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="flex items-center justify-between mb-5">
      <h2 class="text-lg font-semibold text-white">Nouveau client</h2>
      <button onclick="closeNewClientModal()" class="text-slate-400 hover:text-white text-xl leading-none">✕</button>
    </div>
    <div class="space-y-3">
      <div>
        <label class="text-xs text-slate-400 uppercase tracking-wide mb-1.5 block">Nom *</label>
        <input id="nc-name" type="text" class="field-input" placeholder="Jean Dupont" />
      </div>
      <div>
        <label class="text-xs text-slate-400 uppercase tracking-wide mb-1.5 block">Entreprise</label>
        <input id="nc-company" type="text" class="field-input" placeholder="ACME Corp" />
      </div>
      <button onclick="createClient()" class="btn-primary w-full mt-2">Créer le client</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════
     MODAL : CONFIRMER SUPPRESSION
═══════════════════════════════════════ -->
<div id="modal-delete" class="modal-bg hidden" onclick="closeDeleteModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <h2 class="text-lg font-semibold text-white mb-2">Supprimer ce RDV ?</h2>
    <p class="text-slate-400 text-sm mb-5">Cette action est irréversible. L'enregistrement audio sera supprimé.</p>
    <div class="flex gap-3">
      <button onclick="closeDeleteModal()" class="btn-ghost flex-1">Annuler</button>
      <button onclick="confirmDelete()" style="background:#ef4444;color:white;font-weight:600;border-radius:12px;padding:12px 20px;flex:1;">Supprimer</button>
    </div>
  </div>
</div>

<script>
  const COLORS = ['#14b8a6','#6366f1','#f59e0b','#ec4899','#3b82f6','#10b981'];
  let currentClientId = null;
  let deleteMeetingId = null;

  function colorFor(id) { return COLORS[id % COLORS.length]; }
  function initials(name) { return name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase(); }
  function fmtDate(iso) { return new Date(iso).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }); }
  function fmtDuration(s) { if (!s) return ''; const m = Math.round(s/60); return m < 1 ? '< 1 min' : `${m} min`; }
  function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  // ── Écran clients ──
  async function loadClients() {
    const clients = await fetch('/api/clients').then(r => r.json());
    const list = document.getElementById('clients-list');
    const empty = document.getElementById('clients-empty');
    if (clients.length === 0) { list.classList.add('hidden'); empty.classList.remove('hidden'); return; }
    empty.classList.add('hidden');
    list.classList.remove('hidden');
    list.innerHTML = clients.map(c => `
      <div onclick="showMeetings(${c.id}, '${escHtml(c.name)}', '${escHtml(c.company||'')}')"
           class="glass glass-hover rounded-2xl p-4 flex items-center gap-3 cursor-pointer transition-all">
        <div class="avatar" style="background:${colorFor(c.id)}22;color:${colorFor(c.id)}">${initials(c.name)}</div>
        <div class="flex-1 min-w-0">
          <p class="font-semibold text-white truncate">${escHtml(c.name)}</p>
          ${c.company ? `<p class="text-sm text-slate-400 truncate">${escHtml(c.company)}</p>` : ''}
        </div>
        <div class="text-right shrink-0 mr-1">
          <p class="text-sm text-slate-300 font-medium">${c.meeting_count} RDV</p>
        </div>
        <svg class="text-slate-600 shrink-0" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    `).join('');
  }

  function showClients() {
    document.getElementById('screen-meetings').classList.remove('active');
    document.getElementById('screen-clients').classList.add('active');
    currentClientId = null;
    loadClients();
  }

  // ── Écran meetings ──
  async function showMeetings(clientId, clientName, clientCompany) {
    currentClientId = clientId;
    document.getElementById('screen-clients').classList.remove('active');
    document.getElementById('screen-meetings').classList.add('active');
    document.getElementById('client-name-title').textContent = clientName;
    document.getElementById('client-company-subtitle').textContent = clientCompany;
    await loadMeetings(clientId);
  }

  async function loadMeetings(clientId) {
    const meetings = await fetch(`/api/clients/${clientId}/meetings`).then(r => r.json());
    const list = document.getElementById('meetings-list');
    const empty = document.getElementById('meetings-empty');
    if (meetings.length === 0) { list.classList.add('hidden'); empty.classList.remove('hidden'); return; }
    empty.classList.add('hidden');
    list.classList.remove('hidden');
    list.innerHTML = meetings.map(m => {
      const dotClass = m.status === 'done' ? 'dot-done' : m.status === 'error' ? 'dot-error' : 'dot-pending';
      const dur = fmtDuration(m.duration_seconds);
      const meta = [fmtDate(m.recorded_at), dur].filter(Boolean).join(' · ');
      return `
        <div class="glass rounded-2xl p-4 flex items-center gap-3">
          <div class="flex-1 min-w-0 cursor-pointer" onclick="window.location.href='/meeting/${m.id}'">
            <div class="flex items-center gap-2 mb-1">
              <div class="status-dot ${dotClass}"></div>
              <p class="font-medium text-white truncate">${escHtml(m.title || 'RDV')}</p>
            </div>
            <p class="text-sm text-slate-400">${meta}${m.status === 'error' ? ' · <span class="text-red-400">Erreur</span>' : ''}</p>
          </div>
          <button onclick="askDelete(${m.id})" class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-500 hover:text-red-400 hover:bg-red-400/10 transition-colors shrink-0">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        </div>
      `;
    }).join('');
  }

  function recordForClient() {
    if (currentClientId) window.location.href = `/record?client_id=${currentClientId}`;
  }

  // ── Modal nouveau client ──
  function openNewClientModal() {
    document.getElementById('modal-client').classList.remove('hidden');
    setTimeout(() => document.getElementById('nc-name').focus(), 100);
  }
  function closeNewClientModal(e) {
    if (!e || e.target === document.getElementById('modal-client') || e.target.tagName !== 'INPUT') {
      document.getElementById('modal-client').classList.add('hidden');
      document.getElementById('nc-name').value = '';
      document.getElementById('nc-company').value = '';
    }
  }
  async function createClient() {
    const name = document.getElementById('nc-name').value.trim();
    if (!name) { document.getElementById('nc-name').focus(); return; }
    const company = document.getElementById('nc-company').value.trim();
    const client = await fetch('/api/clients', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, company: company || null }),
    }).then(r => r.json());
    document.getElementById('modal-client').classList.add('hidden');
    document.getElementById('nc-name').value = '';
    document.getElementById('nc-company').value = '';
    showMeetings(client.id, client.name, client.company || '');
  }

  // ── Suppression meeting ──
  function askDelete(meetingId) {
    deleteMeetingId = meetingId;
    document.getElementById('modal-delete').classList.remove('hidden');
  }
  function closeDeleteModal(e) {
    if (!e || e.target === document.getElementById('modal-delete')) {
      document.getElementById('modal-delete').classList.add('hidden');
      deleteMeetingId = null;
    }
  }
  async function confirmDelete() {
    if (!deleteMeetingId) return;
    await fetch(`/api/meetings/${deleteMeetingId}`, { method: 'DELETE' });
    closeDeleteModal({});
    await loadMeetings(currentClientId);
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !document.getElementById('modal-client').classList.contains('hidden')) createClient();
    if (e.key === 'Escape') { closeNewClientModal({}); closeDeleteModal({}); }
  });

  loadClients();
</script>
</body>
</html>
