<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enregistrement — plaud-local</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: 'Inter', sans-serif; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fdf8f2 0%, #f5ede0 50%, #ede4d3 100%);
      background-attachment: fixed;
    }

    .glass {
      background: rgba(255,255,255,0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.65);
      box-shadow: 0 4px 24px rgba(180,150,100,0.10);
    }

    .glass-header {
      background: rgba(253,248,242,0.70);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255,255,255,0.60);
    }

    .text-main { color: #2d2010; }
    .text-sub  { color: #7c6a50; }
    .accent    { color: #c2784a; }

    input, select {
      background: rgba(255,255,255,0.60);
      border: 1px solid rgba(255,255,255,0.80);
      color: #2d2010;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #c2784a;
      box-shadow: 0 0 0 3px rgba(194,120,74,0.12);
    }
    input::placeholder { color: #b0997e; }
    select option { background: #fdf8f2; color: #2d2010; }

    /* Bouton Record */
    .btn-record {
      width: 140px; height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ef5350, #b71c1c);
      box-shadow:
        0 0 0 0 rgba(220,38,38,0.25),
        0 8px 32px rgba(220,38,38,0.30),
        inset 0 1px 0 rgba(255,255,255,0.15);
      transition: all 0.2s ease;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-record:hover {
      box-shadow: 0 0 0 12px rgba(220,38,38,0.10), 0 8px 32px rgba(220,38,38,0.30), inset 0 1px 0 rgba(255,255,255,0.15);
      transform: scale(1.03);
    }
    .btn-record:active { transform: scale(0.97); }
    .btn-record.recording {
      animation: pulse-ring 1.5s ease-out infinite;
      background: radial-gradient(circle at 35% 35%, #dc2626, #991b1b);
    }
    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 rgba(220,38,38,0.4), 0 8px 32px rgba(220,38,38,0.3), inset 0 1px 0 rgba(255,255,255,0.15); }
      70%  { box-shadow: 0 0 0 24px rgba(220,38,38,0), 0 8px 32px rgba(220,38,38,0.3), inset 0 1px 0 rgba(255,255,255,0.15); }
      100% { box-shadow: 0 0 0 0 rgba(220,38,38,0), 0 8px 32px rgba(220,38,38,0.3), inset 0 1px 0 rgba(255,255,255,0.15); }
    }

    .btn-record.disabled {
      background: radial-gradient(circle at 35% 35%, #d4c4b0, #b8a898);
      box-shadow: none;
      cursor: default;
      animation: none;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <header class="glass-header px-5 py-4 flex items-center gap-3 sticky top-0 z-20">
    <a href="/" class="w-8 h-8 glass rounded-full flex items-center justify-center text-sub hover:opacity-70 transition-opacity">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
    </a>
    <h1 class="font-semibold text-main text-base">Nouveau RDV</h1>
  </header>

  <main class="flex-1 flex flex-col items-center justify-between px-6 py-8 gap-8 max-w-sm mx-auto w-full">

    <!-- Sélecteurs -->
    <div class="w-full space-y-3">
      <select id="select-project" class="w-full rounded-xl px-4 py-3 text-sm backdrop-blur-sm appearance-none">
        <option value="">Sélectionner un projet...</option>
      </select>
      <input id="input-title" type="text" placeholder="Titre du RDV (optionnel)" class="w-full rounded-xl px-4 py-3 text-sm backdrop-blur-sm">
    </div>

    <!-- Zone enregistrement -->
    <div class="flex flex-col items-center gap-6">
      <button id="btn-record" class="btn-record" onclick="toggleRecord()">
        <svg id="icon-mic" class="w-14 h-14 text-white drop-shadow-sm" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
        <svg id="icon-stop" class="w-10 h-10 text-white drop-shadow-sm hidden" fill="currentColor" viewBox="0 0 24 24">
          <rect x="6" y="6" width="12" height="12" rx="3"/>
        </svg>
      </button>

      <div class="text-center space-y-1">
        <div id="timer" class="text-3xl font-light text-main tracking-widest hidden">00:00</div>
        <div id="status-text" class="text-sub text-sm">Appuyez pour démarrer</div>
      </div>

      <!-- Volume -->
      <div id="volume-bar" class="hidden w-48 h-1.5 bg-white/50 rounded-full overflow-hidden">
        <div id="volume-fill" class="h-full bg-[#dc2626]/70 rounded-full transition-all duration-75" style="width:0%"></div>
      </div>
    </div>

    <!-- Upload fichier -->
    <div class="w-full glass rounded-2xl p-5">
      <p class="text-sub text-xs text-center mb-3 font-medium uppercase tracking-wider">Ou importer un fichier</p>
      <label class="flex items-center justify-center gap-2 cursor-pointer group">
        <svg class="w-4 h-4 text-[#c2784a] group-hover:opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
        </svg>
        <span class="text-[#c2784a] text-sm font-medium group-hover:opacity-70 transition-opacity">MP3 · WAV · M4A</span>
        <input id="file-input" type="file" accept="audio/*" class="hidden" onchange="handleFileUpload(event)">
      </label>
      <div id="file-name" class="text-sub text-xs text-center mt-2"></div>
    </div>

  </main>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-8 left-1/2 -translate-x-1/2 glass px-5 py-3 rounded-full text-sm text-main shadow-lg z-50"></div>

  <script>
    let mediaRecorder = null, audioChunks = [], timerInterval = null, analyserInterval = null, seconds = 0;

    async function loadProjects() {
      const res = await fetch('/api/clients');
      const clients = await res.json();
      const select = document.getElementById('select-project');
      const params = new URLSearchParams(window.location.search);
      const preselect = params.get('project_id');

      for (const client of clients) {
        const res2 = await fetch(`/api/clients/${client.id}/projects`);
        const projects = await res2.json();
        if (!projects.length) continue;
        const group = document.createElement('optgroup');
        group.label = client.name;
        for (const p of projects) {
          const opt = document.createElement('option');
          opt.value = p.id;
          opt.textContent = p.name;
          if (preselect && String(p.id) === preselect) opt.selected = true;
          group.appendChild(opt);
        }
        select.appendChild(group);
      }
    }

    async function toggleRecord() {
      if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
      else await startRecording();
    }

    async function startRecording() {
      if (!document.getElementById('select-project').value) {
        showToast('Sélectionnez un projet avant d\'enregistrer');
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
        audioChunks = [];
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = () => uploadAudio(stream);
        mediaRecorder.start(1000);

        const btn = document.getElementById('btn-record');
        btn.classList.add('recording');
        document.getElementById('icon-mic').classList.add('hidden');
        document.getElementById('icon-stop').classList.remove('hidden');
        document.getElementById('timer').classList.remove('hidden');
        document.getElementById('volume-bar').classList.remove('hidden');
        document.getElementById('status-text').textContent = 'Enregistrement en cours...';

        seconds = 0;
        timerInterval = setInterval(() => {
          seconds++;
          const m = String(Math.floor(seconds / 60)).padStart(2, '0');
          const s = String(seconds % 60).padStart(2, '0');
          document.getElementById('timer').textContent = `${m}:${s}`;
        }, 1000);

        const ctx = new AudioContext();
        const source = ctx.createMediaStreamSource(stream);
        const analyser = ctx.createAnalyser();
        source.connect(analyser);
        const data = new Uint8Array(analyser.frequencyBinCount);
        analyserInterval = setInterval(() => {
          analyser.getByteFrequencyData(data);
          const avg = data.reduce((a, b) => a + b) / data.length;
          document.getElementById('volume-fill').style.width = Math.min(avg * 2, 100) + '%';
        }, 80);
      } catch {
        showToast('Accès au microphone refusé');
      }
    }

    function stopRecording() {
      if (!mediaRecorder) return;
      mediaRecorder.stop();
      clearInterval(timerInterval);
      clearInterval(analyserInterval);
      const btn = document.getElementById('btn-record');
      btn.classList.remove('recording');
      btn.classList.add('disabled');
      btn.disabled = true;
      document.getElementById('icon-stop').classList.add('hidden');
      document.getElementById('icon-mic').classList.remove('hidden');
      document.getElementById('volume-bar').classList.add('hidden');
      document.getElementById('status-text').textContent = 'Envoi en cours...';
    }

    async function uploadAudio(stream) {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      const fd = new FormData();
      fd.append('audio', blob, `rdv_${Date.now()}.webm`);
      fd.append('project_id', document.getElementById('select-project').value);
      const title = document.getElementById('input-title').value.trim();
      if (title) fd.append('title', title);
      try {
        const res = await fetch('/api/meetings/upload', { method: 'POST', body: fd });
        const data = await res.json();
        showToast('RDV envoyé — traitement en cours...');
        setTimeout(() => window.location.href = `/meeting/${data.id}`, 1500);
      } catch {
        showToast('Erreur lors de l\'envoi');
      }
    }

    async function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const projectId = document.getElementById('select-project').value;
      if (!projectId) { showToast('Sélectionnez un projet avant d\'importer'); return; }
      document.getElementById('file-name').textContent = file.name;
      document.getElementById('status-text').textContent = 'Upload en cours...';
      const fd = new FormData();
      fd.append('audio', file, file.name);
      fd.append('project_id', projectId);
      const title = document.getElementById('input-title').value.trim();
      if (title) fd.append('title', title);
      try {
        const res = await fetch('/api/meetings/upload', { method: 'POST', body: fd });
        const data = await res.json();
        showToast('Fichier envoyé — traitement en cours...');
        setTimeout(() => window.location.href = `/meeting/${data.id}`, 1500);
      } catch {
        showToast('Erreur lors de l\'upload');
      }
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 3000);
    }

    loadProjects();
  </script>
</body>
</html>
