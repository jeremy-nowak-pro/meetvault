services:
  app:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
      - ./frontend:/app/frontend
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral}
      - PORT=${PORT:-8000}
      - STORAGE_DIR=/app/storage/audio
      - OLLAMA_HOST=http://host.docker.internal:11434
      - DATABASE_URL=sqlite+aiosqlite:////app/data/meetvault.db
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
